name: Deploy to VPS

on:
  push:
    branches:
      - claude/polymarket-wallet-scanner-ofqu0

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              'set -e
               APP_DIR=/opt/polymarket-scanner
               LOG=/var/log/polymarket-scanner.log

               echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Deploy triggered" >> "$LOG"

               # If not cloned yet, do initial clone
               if [ ! -d "$APP_DIR/.git" ]; then
                 echo "First deploy: cloning repo..."
                 git clone --branch claude/polymarket-wallet-scanner-ofqu0 \
                   https://github.com/justintilts333/poly.git "$APP_DIR"
               fi

               cd "$APP_DIR"

               # Pull latest
               git fetch origin claude/polymarket-wallet-scanner-ofqu0
               git reset --hard origin/claude/polymarket-wallet-scanner-ofqu0

               # Install/update dependencies
               npm install --production

               # Restart web server
               if pm2 list | grep -q polymarket-scanner; then
                 pm2 restart polymarket-scanner
               else
                 pm2 start server.js --name polymarket-scanner \
                   --restart-delay=3000 --max-restarts=10
               fi
               pm2 save

               echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Deploy complete" >> "$LOG"
               pm2 status polymarket-scanner

               # Kill stale scanner + restart fresh (fire-and-forget)
               pkill -f "node.*scanner.js" 2>/dev/null || true
               rm -f /tmp/polymarket-scanner.lock
               sleep 1
               nohup node "$APP_DIR/scanner.js" >> "$LOG" 2>&1 &
               echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Scanner launched (PID $!)" >> "$LOG"'

      - name: Verify dashboard is up
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "http://${{ secrets.VPS_HOST }}:3000/health" || echo "000")
          echo "Health check HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: Dashboard not responding yet (may still be starting)"
          else
            echo "Dashboard is live!"
          fi
