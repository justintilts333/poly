name: Deploy to VPS

on:
  push:
    branches:
      - 'claude/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="/opt/polymarket-scanner"
            BRANCH="${{ github.ref_name }}"
            LOG_FILE="/var/log/polymarket-scanner.log"

            echo "=== Deploying branch: $BRANCH ==="

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              git clone --branch "$BRANCH" https://github.com/justintilts333/poly.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            cd "$APP_DIR"
            npm install --production
            cd "$APP_DIR/mcp-polymarket" && npm install --production && cd "$APP_DIR"

            # Restart dashboard via PM2
            if pm2 list | grep -q polymarket-scanner; then
              pm2 restart polymarket-scanner
            else
              pm2 start server.js --name polymarket-scanner --restart-delay=3000 --max-restarts=10
              pm2 save
            fi

            # Restart MCP server via PM2
            if pm2 list | grep -q polymarket-mcp; then
              pm2 restart polymarket-mcp
            else
              pm2 start mcp-polymarket/server.js --name polymarket-mcp --restart-delay=3000 --max-restarts=10
              pm2 save
            fi

            # Restart executor via PM2
            if pm2 list | grep -q polymarket-executor; then
              pm2 restart polymarket-executor
            else
              pm2 start executor.js --name polymarket-executor --restart-delay=5000 --max-restarts=10
              pm2 save
            fi

            echo "=== Deploy complete ==="
            pm2 status
