name: Deploy to VPS

on:
  push:
    branches:
      - claude/polymarket-wallet-scanner-ofqu0

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install dependencies
        run: npm install --production

      - name: Rsync files to VPS
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='data' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=1 -o ServerAliveCountMax=120" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/polymarket-scanner/

      - name: Restart services on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=1 \
              -o ServerAliveCountMax=120 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              'pkill -KILL -f "node.*scanner.js" 2>/dev/null; rm -f /tmp/polymarket-scanner.lock; nohup node /opt/polymarket-scanner/scanner.js </dev/null >> /var/log/polymarket-scanner.log 2>&1 & echo "scanner_pid=$!"'

      - name: Verify dashboard is up
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "http://${{ secrets.VPS_HOST }}:3000/health" || echo "000")
          echo "Health check HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: Dashboard not responding yet (may still be starting)"
          else
            echo "Dashboard is live!"
          fi
